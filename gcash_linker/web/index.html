<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GCash Link Extractor</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">


      <main class="workspace">
        <section class="control-panel panel">
          <div class="panel-heading">
            <div>

              <h2>填写信息</h2>
            </div>

          </div>
          <form id="batch-form">
            <label class="field-block">
              <span class="field-label"><span>accessToken</span><span class="field-index">A</span></span>
              <textarea id="access-tokens" name="access_tokens" rows="7" spellcheck="false" placeholder="每行一个 accessToken"></textarea>
            </label>
            <label class="field-block">
              <span class="field-label"><span>账单出口代理池</span><span class="field-index">B</span></span>
              <textarea id="billing-exit-proxies" name="billing_exit_proxies" rows="4" spellcheck="false" placeholder="host:port:user:password&#10;http://host:port"></textarea>
            </label>
            <label class="field-block">
              <span class="field-label"><span>促销出口代理池</span><span class="field-index">C</span></span>
              <textarea id="promotion-exit-proxies" name="promotion_exit_proxies" rows="4" spellcheck="false" placeholder="host:port:user:password&#10;http://host:port"></textarea>
            </label>

            <div class="form-actions">
              <label class="number-field">
                <span>并发数</span>
                <input id="concurrency" name="concurrency" type="number" value="10" min="1" max="1000" step="1" inputmode="numeric" />
              </label>
              <label class="number-field">
                <span>重试数</span>
                <input id="retry-count" name="retry_count" type="number" value="3" min="0" max="20" step="1" inputmode="numeric" />
              </label>
              <button class="primary-button" type="submit"><span class="button-dot"></span>开始提链</button>
            </div>
          </form>
     </section>

        <section class="tasks-panel panel">
          <div class="panel-heading task-heading">
            <div>
              <h2>任务列表</h2>
            </div>
            <div class="task-heading-actions">
              <button class="clear-completed-button" id="clear-completed-button" type="button">清理未在进行中的任务</button>
              <div class="queue-meta" aria-label="任务统计">
                <span class="queue-total"><strong id="task-count">0</strong><span>条记录</span></span>
                <span class="queue-stat queue-stat-progress"><strong id="progress-count">0</strong><span>进行中</span></span>
                <span class="queue-stat queue-stat-success"><strong id="success-count">0</strong><span>成功</span></span>
                <span class="queue-stat queue-stat-failure"><strong id="failure-count">0</strong><span>失败</span></span>
              </div>
            </div>
          </div>

          <div class="task-list" id="task-list" aria-live="polite">
            <div class="empty-state">
              <div><strong>暂无任务</strong></div>
            </div>
          </div>
          <div class="inline-notice" id="notice" role="status" hidden></div>
        </section>
      </main>


    </div>
    <script src="/app.js" defer></script>
  </body>
</html>
